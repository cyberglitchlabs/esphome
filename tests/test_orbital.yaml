substitutions:
  name: orbital-test
  friendly_name: "Orbital Test"
  wifi_ssid: test_ssid
  wifi_password: test_password
  orbital_weather_entity: weather.test_weather
  orbital_latitude: "41.59"
  orbital_longitude: "-93.62"
  orbital_waste_calendar_entity: calendar.test_waste
  orbital_indoor_entity: sensor.test_indoor
  orbital_weather_forecast_entity: input_text.test_forecast
  orbital_person1_entity: person.test_person
  orbital_person1_label: "Tester"
  orbital_custom1_entity: sensor.test_custom
  orbital_custom1_icon: "\U000F0241"  # mdi:flash
  orbital_custom1_label: "Custom"
  orbital_custom1_unit: " W"

esphome:
  name: ${name}
  friendly_name: "${friendly_name}"

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf

wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}

api:

ota:
  - platform: esphome

packages:
  base: !include ../packages/orbital_base.yaml
