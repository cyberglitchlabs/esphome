name: Validate ESPHome Settings

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    # Catch breakage from new upstream ESPHome releases even when nothing
    # in this repo has changed (runs are pip-installing the latest ESPHome).
    - cron: "0 6 * * 1"

jobs:
  validate:
    name: Validate ${{ matrix.file }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        file:
          - tests/test_s31.yaml
          - tests/test_ifan04.yaml
          - tests/test_owon_xdm.yaml
          - tests/test_wopr.yaml
          - tests/test_rv_tv.yaml
          - tests/test_plant_bot.yaml
          - tests/test_bermuda.yaml
          - tests/test_mochi.yaml
          - tests/test_current_affairs.yaml
          - tests/test_ikea_vindriktning.yaml
          - tests/test_orbital.yaml
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ESPHome
        run: pip install esphome

      - name: Validate Config
        run: esphome config ${{ matrix.file }}
