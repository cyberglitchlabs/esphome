# Example configuration for Sonoff iFan04
# Copy this file to your ESPHome config directory and customize
#
# Name the device for what it controls, with the room as a qualifier
# (e.g. "Bedroom Ceiling", not just "Bedroom" and not "Bedroom Ceiling Fan").
# Home Assistant 2026.11+ shows entities as the device name plus the entity name,
# so entities will appear as "Bedroom Ceiling Light" and "Bedroom Ceiling Fan".
# A bare room name makes a poor device name: the area already provides the room.

# Required in secrets.yaml: wifi_ssid, wifi_password, wifi_fallback_password, api_encryption_key
# (generate the key with: openssl rand -base64 32)
# Encrypted OTA below requires ESPHome 2026.9.0 or newer.

substitutions:
  name: "bedroom-fan"
  friendly_name: "Bedroom Ceiling"

packages:
  device:
    url: https://github.com/cyberglitchlabs/esphome
    files: [packages/ifan04_base.yaml]
    ref: main
    refresh: 1d

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret wifi_fallback_password

api:
  encryption:
    key: !secret api_encryption_key

# OTA encryption reuses the API key (no separate password needed).
# On ESPHome older than 2026.9.0, flash once without `encryption:` first.
ota:
  - platform: esphome
    encryption:
  - platform: web_server

web_server:
  port: 80
