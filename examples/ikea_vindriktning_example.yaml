# Example configuration for IKEA VINDRIKTNING Air Quality Sensor
# Copy this file to your ESPHome config directory and customize

substitutions:
  name: "air-quality-sensor"
  friendly_name: "Air Quality Sensor"

packages:
  device:
    url: https://github.com/cyberglitchlabs/esphome
    files: [packages/ikea_vindriktning.yaml]
    ref: main
    refresh: 1d

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"

api:
  encryption:
    key: !secret api_encryption_key

# OTA encryption reuses the API key (no separate password needed).
# On ESPHome older than 2026.9.0, or when migrating an existing device, flash once
# with the old `password:` first, then switch to `encryption:`.
ota:
  - platform: esphome
    encryption:
  - platform: web_server

web_server:
  port: 80
