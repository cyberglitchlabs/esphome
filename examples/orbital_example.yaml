# Example configuration for HackerBox #0129 Orbital
# Copy this into your ESPHome device configuration and customize.
#
# Hardware: ESP32-S3 SuperMini + 5x round GC9A01A 1.28" displays (240x240) +
# 3 buttons + onboard addressable RGB LED
# Product: https://hackerboxes.com/products/hackerbox-0129-orbital

substitutions:
  friendly_name: "Orbital"

  # Weather: one entity feeds four screens (temp / humidity / condition /
  # wind) by reading its attributes. Units must match what it reports.
  orbital_weather_entity: weather.home
  orbital_weather_temp_unit: "°F"
  orbital_weather_wind_unit: " mph"

  # Forecast: HA has no forecast attribute any more, so this must be an entity
  # you precompute. See docs/orbital.md for the helper + automation.
  orbital_weather_forecast_entity: input_text.orbital_forecast_summary

  # Presence: entity plus a short name to caption the screen with.
  orbital_person1_entity: person.jane
  orbital_person1_label: "Jane"

  # Custom: entity, an icon from the palette baked into the font, a caption,
  # and a unit appended to numeric states.
  orbital_custom1_entity: sensor.grid_power
  orbital_custom1_icon: "\U000F0241"  # mdi:flash
  orbital_custom1_label: "Grid"
  orbital_custom1_unit: " W"

esphome:
  name: orbital
  friendly_name: "${friendly_name}"

packages:
  device:
    url: https://github.com/cyberglitchlabs/esphome
    files: [packages/orbital_base.yaml]
    ref: main
    refresh: 1d

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2
  ap:
    ssid: "${friendly_name} Fallback"
    password: ""

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password
