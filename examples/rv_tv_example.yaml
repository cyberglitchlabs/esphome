substitutions:
  friendly_name: "RV TV Lift"
  # Pin overrides — only needed if your wiring differs from defaults
  # tv_power_pin: GPIO26
  # motor_up_pin: GPIO32
  # motor_down_pin: GPIO33
  # button_pin: GPIO19
  # adc_lowered_pin: GPIO35
  # adc_raised_pin: GPIO34

esphome:
  name: rv-tv
  friendly_name: ${friendly_name}

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret fallback_password

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80

packages:
  device:
    url: https://github.com/cyberglitchlabs/esphome
    files: [packages/rv_tv_base.yaml]
    ref: main
    refresh: 1d
