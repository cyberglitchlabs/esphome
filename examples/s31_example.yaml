# Example configuration for Sonoff S31
# Copy this into your ESPHome device configuration and customize

substitutions:
  friendly_name: "My Plug"
  # Relay restore mode: ALWAYS_OFF, ALWAYS_ON, RESTORE_DEFAULT_OFF, RESTORE_DEFAULT_ON
  relay_restore_mode: "ALWAYS_OFF"

esphome:
  name: my-plug
  friendly_name: "${friendly_name}"

packages:
  device:
    url: https://github.com/cyberglitchlabs/esphome
    files: [packages/s31_base.yaml]
    ref: main
    refresh: 1d

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2
  ap:
    ssid: "${friendly_name} Fallback"
    password: ""

api:
  encryption:
    key: !secret api_encryption_key

# OTA encryption reuses the API key (no separate password needed).
# On ESPHome older than 2026.9.0, or when migrating an existing device, flash once
# with the old `password:` first, then switch to `encryption:`.
ota:
  - platform: esphome
    encryption:

web_server:
  port: 80
