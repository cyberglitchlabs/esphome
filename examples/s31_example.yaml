# Example configuration for Sonoff S31
# Copy this into your ESPHome device configuration and customize

substitutions:
  friendly_name: "My Plug"
  # Relay restore mode: ALWAYS_OFF, ALWAYS_ON, RESTORE_DEFAULT_OFF, RESTORE_DEFAULT_ON
  relay_restore_mode: "ALWAYS_OFF"

esphome:
  name: my-plug
  friendly_name: "${friendly_name}"
  project:
    name: "cyberglitchlabs.sonoff_s31"
    version: "1.0.0"

packages:
  device:
    url: https://github.com/cyberglitchlabs/esphome
    files: [packages/s31_base.yaml]
    ref: main
    refresh: 1d

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2
  ap:
    ssid: "${friendly_name} Fallback"
    password: ""

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80
