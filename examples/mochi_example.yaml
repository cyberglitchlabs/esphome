# Example configuration for HackerBox #0125 Mochi Companion
# Copy this into your ESPHome device configuration and customize.
#
# Hardware: ESP32-C3 Super Mini + 1.3in OLED + touch sensor + speaker
# Product: https://www.instructables.com/HackerBox-0125-Vitality/

substitutions:
  friendly_name: "Mochi Companion"
  # Update these to your Home Assistant entities:
  weather_temp_entity: sensor.openweathermap_temperature
  weather_condition_entity: weather.home
  data_entity: sensor.outdoor_humidity
  data_label: "Humidity"
  data_unit: "%"
  sun_entity: sun.sun

esphome:
  name: mochi
  friendly_name: "${friendly_name}"

packages:
  device:
    url: https://github.com/cyberglitchlabs/esphome
    files: [packages/mochi_base.yaml]
    ref: main
    refresh: 1d

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2
  ap:
    ssid: "${friendly_name} Fallback"
    password: ""

api:
  encryption:
    key: !secret api_encryption_key

# OTA encryption reuses the API key (no separate password needed).
# On ESPHome older than 2026.9.0, or when migrating an existing device, flash once
# with the old `password:` first, then switch to `encryption:`.
ota:
  - platform: esphome
    encryption:
