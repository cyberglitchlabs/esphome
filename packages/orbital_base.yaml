# HackerBox #0129 Orbital Hardware Package
# This package provides hardware-specific configuration for the Orbital
# ESP32-S3 SuperMini device driving five round 1.28" GC9A01A displays
# (240x240 each) via LVGL, three navigation buttons, and an onboard
# addressable RGB status LED. Pinout confirmed from the HackerBox 0129
# Instructables guide (Step 5) — differs from the upstream info-orbs
# project, which targets a plain ESP32.
#
# Required in your device yaml:
#   esphome:
#     name: your-device-name
#     friendly_name: "Your Device Name"
#
# Usage:
#   packages:
#     device:
#       url: https://github.com/cyberglitchlabs/esphome
#       files: [packages/orbital_base.yaml]
#       ref: main

substitutions:
  name: "orbital"
  friendly_name: "Orbital"

  # SPI bus (shared by all five displays)
  orbital_mosi_pin: GPIO11
  orbital_sclk_pin: GPIO12
  orbital_dc_pin: GPIO9
  orbital_reset_pin: GPIO13

  # Per-display chip-select pins
  orbital_cs1_pin: GPIO4
  orbital_cs2_pin: GPIO5
  orbital_cs3_pin: GPIO6
  orbital_cs4_pin: GPIO7
  orbital_cs5_pin: GPIO8

  # Buttons
  orbital_button_left_pin: GPIO2
  orbital_button_ok_pin: GPIO1
  orbital_button_right_pin: GPIO3

  # Onboard addressable RGB LED
  orbital_led_pin: GPIO48

  # Auto-cycle timing (only used while auto-cycle is toggled on via long-press OK)
  orbital_autocycle_interval: 30s

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  project:
    name: cyberglitchlabs.hackerbox_orbital
    version: "1.0.0"

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf

api:
  reboot_timeout: 0s

logger:

time:
  - platform: homeassistant
    id: orbital_time

globals:
  - id: current_set
    type: int
    restore_value: false
    initial_value: "0"

web_server:
  port: 80

# ---------------------------------------------------------------------------
# Hardware: Displays (5x round GC9A01A, shared SPI bus)
# ---------------------------------------------------------------------------

spi:
  id: spi_bus
  clk_pin: ${orbital_sclk_pin}
  mosi_pin: ${orbital_mosi_pin}

display:
  - platform: ili9xxx
    model: GC9A01A
    id: display_1
    spi_id: spi_bus
    cs_pin: ${orbital_cs1_pin}
    dc_pin:
      number: ${orbital_dc_pin}
      allow_other_uses: true
    reset_pin:
      number: ${orbital_reset_pin}
      allow_other_uses: true
    invert_colors: true
    auto_clear_enabled: false
    update_interval: never  # LVGL drives redraws; no polling needed
  - platform: ili9xxx
    model: GC9A01A
    id: display_2
    spi_id: spi_bus
    cs_pin: ${orbital_cs2_pin}
    dc_pin:
      number: ${orbital_dc_pin}
      allow_other_uses: true
    reset_pin:
      number: ${orbital_reset_pin}
      allow_other_uses: true
    invert_colors: true
    auto_clear_enabled: false
    update_interval: never
  - platform: ili9xxx
    model: GC9A01A
    id: display_3
    spi_id: spi_bus
    cs_pin: ${orbital_cs3_pin}
    dc_pin:
      number: ${orbital_dc_pin}
      allow_other_uses: true
    reset_pin:
      number: ${orbital_reset_pin}
      allow_other_uses: true
    invert_colors: true
    auto_clear_enabled: false
    update_interval: never
  - platform: ili9xxx
    model: GC9A01A
    id: display_4
    spi_id: spi_bus
    cs_pin: ${orbital_cs4_pin}
    dc_pin:
      number: ${orbital_dc_pin}
      allow_other_uses: true
    reset_pin:
      number: ${orbital_reset_pin}
      allow_other_uses: true
    invert_colors: true
    auto_clear_enabled: false
    update_interval: never
  - platform: ili9xxx
    model: GC9A01A
    id: display_5
    spi_id: spi_bus
    cs_pin: ${orbital_cs5_pin}
    dc_pin:
      number: ${orbital_dc_pin}
      allow_other_uses: true
    reset_pin:
      number: ${orbital_reset_pin}
      allow_other_uses: true
    invert_colors: true
    auto_clear_enabled: false
    update_interval: never

# ---------------------------------------------------------------------------
# LVGL: one instance per display, four pages each (Clock/Weather/Presence/Custom)
# ---------------------------------------------------------------------------

lvgl:
  - id: lvgl_1
    displays:
      - display_1
    buffer_size: 10%
    pages:
      - id: clock_1
        widgets:
          - label:
              id: clock_time_1
              align: CENTER
              text: "00:00:00"
      - id: weather_1
        widgets:
          - label:
              id: weather_label_1
              align: CENTER
              text: "—"
      - id: presence_1
        widgets:
          - label:
              id: presence_label_1
              align: CENTER
              text: "—"
      - id: custom_1
        widgets:
          - label:
              id: custom_label_1
              align: CENTER
              text: "—"

  - id: lvgl_2
    displays:
      - display_2
    buffer_size: 10%
    pages:
      - id: clock_2
        widgets:
          - label:
              id: clock_date_2
              align: CENTER
              text: "0000-00-00"
      - id: weather_2
        widgets:
          - label:
              id: weather_label_2
              align: CENTER
              text: "—"
      - id: presence_2
        widgets:
          - label:
              id: presence_label_2
              align: CENTER
              text: "—"
      - id: custom_2
        widgets:
          - label:
              id: custom_label_2
              align: CENTER
              text: "—"

  - id: lvgl_3
    displays:
      - display_3
    buffer_size: 10%
    pages:
      - id: clock_3
        widgets:
          - label:
              id: clock_day_3
              align: CENTER
              text: "-"
      - id: weather_3
        widgets:
          - label:
              id: weather_label_3
              align: CENTER
              text: "—"
      - id: presence_3
        widgets:
          - label:
              id: presence_label_3
              align: CENTER
              text: "—"
      - id: custom_3
        widgets:
          - label:
              id: custom_label_3
              align: CENTER
              text: "—"

  - id: lvgl_4
    displays:
      - display_4
    buffer_size: 10%
    pages:
      - id: clock_4
        widgets:
          - label:
              id: clock_uptime_4
              align: CENTER
              text: "0s"
      - id: weather_4
        widgets:
          - label:
              id: weather_label_4
              align: CENTER
              text: "—"
      - id: presence_4
        widgets:
          - label:
              id: presence_label_4
              align: CENTER
              text: "—"
      - id: custom_4
        widgets:
          - label:
              id: custom_label_4
              align: CENTER
              text: "—"

  - id: lvgl_5
    displays:
      - display_5
    buffer_size: 10%
    pages:
      - id: clock_5
        widgets:
          - label:
              id: clock_wifi_5
              align: CENTER
              text: "0 dB"
      - id: weather_5
        widgets:
          - label:
              id: weather_label_5
              align: CENTER
              text: "—"
      - id: presence_5
        widgets:
          - label:
              id: presence_label_5
              align: CENTER
              text: "—"
      - id: custom_5
        widgets:
          - label:
              id: custom_label_5
              align: CENTER
              text: "—"

# ---------------------------------------------------------------------------
# Interval: drive Clock page labels from time
# ---------------------------------------------------------------------------

interval:
  - interval: 1s
    then:
      - lvgl.label.update:
          id: clock_time_1
          text:
            time_format: "%H:%M:%S"
            time: orbital_time
  - interval: 60s
    then:
      - lvgl.label.update:
          id: clock_date_2
          text:
            time_format: "%Y-%m-%d"
            time: orbital_time
      - lvgl.label.update:
          id: clock_day_3
          text:
            time_format: "%A"
            time: orbital_time

# ---------------------------------------------------------------------------
# Diagnostic / management entities
# ---------------------------------------------------------------------------

binary_sensor:
  - platform: status
    name: "Status"
    entity_category: diagnostic

sensor:
  - platform: wifi_signal
    id: wifi_signal_sensor
    name: "WiFi Signal"
    update_interval: 60s
    entity_category: diagnostic
    on_value:
      - lvgl.label.update:
          id: clock_wifi_5
          text:
            format: "%.0f dB"
            args: [x]
  - platform: uptime
    id: uptime_sensor
    name: "Uptime"
    update_interval: 60s
    entity_category: diagnostic
    on_value:
      - lvgl.label.update:
          id: clock_uptime_4
          text:
            format: "%.0f s"
            args: [x]

button:
  - platform: restart
    name: "Restart"
    entity_category: config
  - platform: safe_mode
    name: "Safe Mode"
    entity_category: config

text_sensor:
  - platform: version
    name: "ESPHome Version"
    entity_category: diagnostic
  - platform: wifi_info
    ip_address:
      name: WiFi IP Address
      entity_category: diagnostic
    ssid:
      name: WiFi SSID
      entity_category: diagnostic
    mac_address:
      name: WiFi MAC Address
      entity_category: diagnostic
