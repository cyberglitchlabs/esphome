            format: "%.0f${orbital_weather_temp_unit}"
            args: [x]
  - platform: homeassistant
    id: weather_humidity_num
    entity_id: ${orbital_weather_entity}
    attribute: humidity
    internal: true
    on_value:
      - lvgl.label.update:
