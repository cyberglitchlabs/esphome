# HackerBox #0129 Orbital Hardware Package
# This package provides hardware-specific configuration for the Orbital
# ESP32-S3 SuperMini device driving five round 1.28" GC9A01A displays
# (240x240 each) via LVGL, three navigation buttons, and an onboard
# addressable RGB status LED. Pinout confirmed from the HackerBox 0129
# Instructables guide (Step 5) — differs from the upstream info-orbs
# project, which targets a plain ESP32.
#
# Required in your device yaml:
#   esphome:
#     name: your-device-name
#     friendly_name: "Your Device Name"
#
# Usage:
#   packages:
#     device:
#       url: https://github.com/cyberglitchlabs/esphome
#       files: [packages/orbital_base.yaml]
#       ref: main

substitutions:
  name: "orbital"
  friendly_name: "Orbital"

  # SPI bus (shared by all five displays)
  orbital_mosi_pin: GPIO11
  orbital_sclk_pin: GPIO12
  orbital_dc_pin: GPIO9
  orbital_reset_pin: GPIO13

  # Per-display chip-select pins
  orbital_cs1_pin: GPIO4
  orbital_cs2_pin: GPIO5
  orbital_cs3_pin: GPIO6
  orbital_cs4_pin: GPIO7
  orbital_cs5_pin: GPIO8

  # Buttons
  orbital_button_left_pin: GPIO2
  orbital_button_ok_pin: GPIO1
  orbital_button_right_pin: GPIO3

  # Onboard addressable RGB LED
  orbital_led_pin: GPIO48

  # Auto-cycle timing (only used while auto-cycle is toggled on via long-press OK)
  orbital_autocycle_interval: 30s

  # Clock screen 4 computes sunrise/sunset on-device rather than reading
  # sun.sun from HA: no ISO-8601/timezone parsing, and it keeps working while
  # HA is down. Set these in YOUR DEVICE YAML, not here. Two decimal places is
  # about 1 km, which moves sunrise by a couple of seconds -- there is no
  # reason to publish your house to more precision than that.
  orbital_latitude: "0.00"
  orbital_longitude: "0.00"

  # Clock screen 3: an HA calendar whose next event describes a waste pickup.
  # Read via its `description` attribute, which carries the full combined text
  # ("Garbage, recycling, and yard waste") rather than a single stream.
  orbital_waste_calendar_entity: calendar.recollect

  # Clock screen 5
  orbital_indoor_entity: sensor.indoor_temperature
  orbital_indoor_unit: "°F"

  # Weather set — screens 1/2/3/4 all read from a SINGLE HA weather entity:
  # temperature, humidity and wind_speed come off its attributes, and its
  # plain state drives the condition icon. Any weather.* entity works.
  #
  # BREAKING CHANGE (was: four separate orbital_weather_*_entity keys). The
  # old keys pointed at standalone sensor.* entities; attributes replace them
  # because a weather entity always carries all four in lockstep, and numeric
  # attributes arrive as floats we can round rather than as raw state strings.
  orbital_weather_entity: weather.home

  # Screen 5 — the forecast. HA removed the `forecast` attribute from weather
  # entities in 2024.4, so a forecast can only reach ESPHome through an entity
  # you precompute in HA (an input_text driven by an automation that calls
  # weather.get_forecasts). docs/orbital.md has the automation. Any entity
  # holding a short string works here.
  orbital_weather_forecast_entity: input_text.orbital_forecast_summary

  # Units appended to the weather values. Attributes arrive as bare numbers
  # with no unit attached, so these must match what your weather entity
  # reports in — check its temperature_unit / wind_speed_unit attributes.
  orbital_weather_temp_unit: "°F"
  orbital_weather_wind_unit: " mph"

  # Presence set — point these at your HA person.* entities. Each screen shows
  # a state icon (home / walking / unknown), the state, and the person's name,
  # so give every slot a _label short enough to fit a 240px round display.
  # Note: this repo's bermuda_base.yaml package is a bare BLE proxy with no
  # person entities of its own; if you use Bermuda for presence, point these
  # at whatever entities the Bermuda HA integration created for you.
  orbital_person1_entity: person.person_1
  orbital_person1_label: "Person 1"
  orbital_person2_entity: person.person_2
  orbital_person2_label: "Person 2"
  orbital_person3_entity: person.person_3
  orbital_person3_label: "Person 3"
  orbital_person4_entity: person.person_4
  orbital_person4_label: "Person 4"
  orbital_person5_entity: person.person_5
  orbital_person5_label: "Person 5"

  # Custom set — point these at absolutely anything HA already tracks
  # (energy, stocks, whatever). Each slot takes four keys:
  #   _entity  the HA entity whose state is displayed
  #   _icon    an MDI codepoint, baked into the font at build time (below)
  #   _label   a short caption so the number means something
  #   _unit    appended to numeric states; leave "" for text states.
  #            Must not contain a literal % — it is used as a printf format.
  # _icon must be one of the codepoints baked into the weather_icons font
  # below; slots may reuse the same icon. The palette there covers the common
  # cases (gauge, flash, currency, battery, wifi, chart, clock, leaf, car,
  # thermometer, water, printer, server, bell, package) — to use anything
  # else, add its codepoint to that glyph list too.
  orbital_custom1_entity: sensor.custom_1
  orbital_custom1_icon: "\U000F029A"  # mdi:gauge
  orbital_custom1_label: "Custom 1"
  orbital_custom1_unit: ""
  orbital_custom2_entity: sensor.custom_2
  orbital_custom2_icon: "\U000F029A"  # mdi:gauge
  orbital_custom2_label: "Custom 2"
  orbital_custom2_unit: ""
  orbital_custom3_entity: sensor.custom_3
  orbital_custom3_icon: "\U000F029A"  # mdi:gauge
  orbital_custom3_label: "Custom 3"
  orbital_custom3_unit: ""
  orbital_custom4_entity: sensor.custom_4
  orbital_custom4_icon: "\U000F029A"  # mdi:gauge
  orbital_custom4_label: "Custom 4"
  orbital_custom4_unit: ""
  orbital_custom5_entity: sensor.custom_5
  orbital_custom5_icon: "\U000F029A"  # mdi:gauge
  orbital_custom5_label: "Custom 5"
  orbital_custom5_unit: ""

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  project:
    name: cyberglitchlabs.hackerbox_orbital
    version: "1.0.0"
  on_boot:
    then:
      - light.turn_on:
          id: status_light
          red: 100%
          green: 0%
          blue: 0%

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf

api:
  reboot_timeout: 0s
  on_client_connected:
    - light.turn_on:
        id: status_light
        red: 0%
        green: 100%
        blue: 0%
  on_client_disconnected:
    - if:
        condition:
          wifi.connected:
        then:
          - light.turn_on:
              id: status_light
              red: 100%
              green: 80%
              blue: 0%

wifi:
  on_connect:
    - light.turn_on:
        id: status_light
        red: 100%
        green: 80%
        blue: 0%
  on_disconnect:
    - light.turn_on:
        id: status_light
        red: 100%
        green: 0%
        blue: 0%

logger:

time:
  - platform: homeassistant
    id: orbital_time

sun:
  id: orbital_sun
  latitude: ${orbital_latitude}
  longitude: ${orbital_longitude}

globals:
  - id: current_set
    type: int
    restore_value: false
    initial_value: "0"
  - id: autocycle_enabled
    type: bool
    restore_value: false
    initial_value: "false"

web_server:
  port: 80

# ---------------------------------------------------------------------------
# Hardware: Displays (5x round GC9A01A, shared SPI bus)
# ---------------------------------------------------------------------------

spi:
  id: spi_bus
  clk_pin: ${orbital_sclk_pin}
  mosi_pin: ${orbital_mosi_pin}

display:
  - platform: mipi_spi
    model: GC9A01A
    id: display_1
    spi_id: spi_bus
    cs_pin: ${orbital_cs1_pin}
    dc_pin:
      number: ${orbital_dc_pin}
      allow_other_uses: true
    reset_pin: ${orbital_reset_pin}
    invert_colors: true
    auto_clear_enabled: false
    update_interval: never  # LVGL drives redraws; no polling needed
  - platform: mipi_spi
    model: GC9A01A
    id: display_2
    spi_id: spi_bus
    cs_pin: ${orbital_cs2_pin}
    dc_pin:
      number: ${orbital_dc_pin}
      allow_other_uses: true
    invert_colors: true
    auto_clear_enabled: false
    update_interval: never
  - platform: mipi_spi
    model: GC9A01A
    id: display_3
    spi_id: spi_bus
    cs_pin: ${orbital_cs3_pin}
    dc_pin:
      number: ${orbital_dc_pin}
      allow_other_uses: true
    invert_colors: true
    auto_clear_enabled: false
    update_interval: never
  - platform: mipi_spi
    model: GC9A01A
    id: display_4
    spi_id: spi_bus
    cs_pin: ${orbital_cs4_pin}
    dc_pin:
      number: ${orbital_dc_pin}
      allow_other_uses: true
    invert_colors: true
    auto_clear_enabled: false
    update_interval: never
  - platform: mipi_spi
    model: GC9A01A
    id: display_5
    spi_id: spi_bus
    cs_pin: ${orbital_cs5_pin}
    dc_pin:
      number: ${orbital_dc_pin}
      allow_other_uses: true
    invert_colors: true
    auto_clear_enabled: false
    update_interval: never

# ---------------------------------------------------------------------------
# Fonts: Material Design Icons, subset to the weather condition glyphs HA's
# weather integration actually reports (clear-night/cloudy/exceptional/fog/
# hail/lightning/lightning-rainy/partlycloudy/pouring/rainy/snowy/
# snowy-rainy/sunny/windy/windy-variant, plus a sunny-off fallback for an
# unrecognized condition string). Fetched from jsDelivr (pinned to a specific
# @mdi/font release, not @latest) rather than committed locally — font file:
# paths resolve relative to whatever top-level config includes this package,
# so a local path would need duplicating into every consumer's directory.
# Source: https://github.com/Templarian/MaterialDesign-Webfont (SIL OFL 1.1).
# ---------------------------------------------------------------------------

font:
  - file: "https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.ttf"
    id: weather_icons
    size: 64
    bpp: 4
    glyphs: [
      "\U000F0594", # clear-night
      "\U000F0590", # cloudy
      "\U000F0F2F", # exceptional
      "\U000F0591", # fog
      "\U000F0592", # hail
      "\U000F0593", # lightning
      "\U000F067E", # lightning-rainy
      "\U000F0595", # partlycloudy
      "\U000F0596", # pouring
      "\U000F0597", # rainy
      "\U000F0598", # snowy
      "\U000F067F", # snowy-rainy
      "\U000F0599", # sunny
      "\U000F059D", # windy
      "\U000F059E", # windy-variant
      "\U000F14E4", # sunny-off (fallback for unknown conditions)
      # Measurement icons for the weather screens that show a number
      "\U000F050F", # thermometer  -> temperature
      "\U000F058E", # water-percent -> humidity
      "\U000F0E17", # calendar-month -> forecast
      # Clock-set icons
      "\U000F0A79", # trash-can     -> waste pickup
      "\U000F044C", # recycle       -> recycling included this week
      "\U000F059C", # weather-sunset-up   -> next event is sunrise
      "\U000F059B", # weather-sunset-down -> next event is sunset
      # Presence state icons
      "\U000F02DC", # home        -> person is home
      "\U000F0583", # walk        -> person is away
      "\U000F02D7", # help-circle -> unknown / unavailable
      # General-purpose palette for the custom slots. This list is static on
      # purpose: ESPHome rejects a font whose glyph list contains duplicates,
      # so interpolating the five orbital_custom*_icon substitutions here
      # would break as soon as two slots picked the same icon (two power
      # readings both wanting mdi:flash, say). Baking a fixed palette instead
      # means a substitution only selects a glyph that is already present, and
      # slots may freely repeat. To use an icon that is not listed, add its
      # codepoint here as well as setting the substitution.
      "\U000F029A", # gauge
      "\U000F0241", # flash
      "\U000F140B", # lightning-bolt
      "\U000F01C1", # currency-usd
      "\U000F0079", # battery
      "\U000F05A9", # wifi
      "\U000F012A", # chart-line
      "\U000F0150", # clock-outline
      "\U000F032A", # leaf
      "\U000F010B", # car
      "\U000F0F54", # home-thermometer
      "\U000F058C", # water
      "\U000F042B", # printer-3d
      "\U000F048D", # server-network
      "\U000F009A", # bell
      "\U000F03D6", # package-variant
      ]

# ---------------------------------------------------------------------------
# LVGL: one instance per display, four pages each (Clock/Weather/Presence/Custom)
# ---------------------------------------------------------------------------

lvgl:
  - id: lvgl_1
    displays:
      - display_1
    buffer_size: 10%
    default_font: montserrat_28
    # dark_mode applies globally across all 5 LVGL instances even though it's
    # only declared here — ESPHome only allows `theme:` on one instance when
    # multiple LVGL instances are in play (it's one shared define, not
    # per-instance), so don't copy this block onto lvgl_2..lvgl_5.
    theme:
      dark_mode: true
    pages:
      - id: clock_1
        widgets:
          - obj:
              width: 240
              height: 240
              align: CENTER
              pad_all: 0
              border_width: 0
              bg_color: 0x000000
              widgets:
                - meter:
                    id: clock_meter_1
                    height: 220
                    width: 220
                    align: CENTER
                    bg_opa: TRANSP
                    border_width: 0
                    scales:
                      - range_from: 0 # minutes scale (outer ring of ticks)
                        range_to: 60
                        angle_range: 360
                        rotation: 270
                        ticks:
                          width: 1
                          count: 61
                          length: 6
                          color: 0x444444
                        indicators:
                          - line:
                              id: minute_hand
                              width: 3
                              color: 0x00D9FF
                              length: 90%
                              value: 0
                      - range_from: 1 # hour scale (numbered 1-12 major ticks)
                        range_to: 12
                        angle_range: 330
                        rotation: 300
                        ticks:
                          width: 1
                          count: 12
                          length: 1
                          major:
                            stride: 1
                            width: 3
                            length: 14
                            color: 0xAAAAAA
                            label_gap: 10
                      - range_from: 0 # hi-res hours scale, drives the hour hand
                        range_to: 720
                        angle_range: 360
                        rotation: 270
                        indicators:
                          - line:
                              id: hour_hand
                              width: 5
                              color: 0xFF9500
                              length: 65%
                              value: 0
      - id: weather_1
        widgets:
          - label:
              id: weather_icon_1
              align: CENTER
              y: -34
              text_font: weather_icons
              text_color: 0xFF7A33
              text: "\U000F050F"
          - label:
              id: weather_label_1
              align: CENTER
              y: 18
              text: "-"
      - id: presence_1
        widgets:
          - label:
              id: presence_icon_1
              align: CENTER
              y: -44
              text_font: weather_icons
              text_color: 0x5A6472
              text: "\U000F02D7"
          - label:
              id: presence_label_1
              align: CENTER
              y: 4
              text: "-"
          - label:
              id: presence_name_1
              align: CENTER
              y: 38
              text_font: montserrat_14
              text_color: 0x6B7380
              text: "${orbital_person1_label}"
      - id: custom_1
        widgets:
          - label:
              id: custom_icon_1
              align: CENTER
              y: -44
              text_font: weather_icons
              text_color: 0x00D9FF
              text: "${orbital_custom1_icon}"
          - label:
              id: custom_label_1
              align: CENTER
              y: 4
              text: "-"
          - label:
              id: custom_name_1
              align: CENTER
              y: 38
              text_font: montserrat_14
              text_color: 0x6B7380
              text: "${orbital_custom1_label}"

  - id: lvgl_2
    displays:
      - display_2
    buffer_size: 10%
    default_font: montserrat_28
    pages:
      - id: clock_2
        widgets:
          - label:
              id: clock_month_2
              align: CENTER
              y: -52
              text_font: montserrat_14
              text_color: 0x6B7380
              text: "---"
          - label:
              id: clock_date_2
              align: CENTER
              y: -4
              text_font: montserrat_48
              text: "00"
          - label:
              id: clock_dow_2
              align: CENTER
              y: 42
              text_font: montserrat_14
              text_color: 0x6B7380
              text: "---"
      - id: weather_2
        widgets:
          - label:
              id: weather_icon_2
              align: CENTER
              y: -34
              text_font: weather_icons
              text_color: 0x00B4D8
              text: "\U000F058E"
          - label:
              id: weather_label_2
              align: CENTER
              y: 18
              text: "-"
      - id: presence_2
        widgets:
          - label:
              id: presence_icon_2
              align: CENTER
              y: -44
              text_font: weather_icons
              text_color: 0x5A6472
              text: "\U000F02D7"
          - label:
              id: presence_label_2
              align: CENTER
              y: 4
              text: "-"
          - label:
              id: presence_name_2
              align: CENTER
              y: 38
              text_font: montserrat_14
              text_color: 0x6B7380
              text: "${orbital_person2_label}"
      - id: custom_2
        widgets:
          - label:
              id: custom_icon_2
              align: CENTER
              y: -44
              text_font: weather_icons
              text_color: 0x00D9FF
              text: "${orbital_custom2_icon}"
          - label:
              id: custom_label_2
              align: CENTER
              y: 4
              text: "-"
          - label:
              id: custom_name_2
              align: CENTER
              y: 38
              text_font: montserrat_14
              text_color: 0x6B7380
              text: "${orbital_custom2_label}"

  - id: lvgl_3
    displays:
      - display_3
    buffer_size: 10%
    default_font: montserrat_28
    pages:
      - id: clock_3
        widgets:
          # Both icons are always present in the same place; only the recycle
          # symbol's colour changes. Position never moving is what makes it
          # readable at a glance instead of something you have to parse.
          - label:
              id: waste_trash_3
              align: CENTER
              x: -34
              y: -30
              text_font: weather_icons
              text_color: 0xC9D1D9
              text: "\U000F0A79"
          - label:
              id: waste_recycle_3
              align: CENTER
              x: 34
              y: -30
              text_font: weather_icons
              text_color: 0x22272E
              text: "\U000F044C"
          - label:
              id: waste_when_3
              align: CENTER
              y: 38
              text: "-"
      - id: weather_3
        widgets:
          - label:
              id: weather_label_3
              align: CENTER
              text_font: weather_icons
              text: ""
      - id: presence_3
        widgets:
          - label:
              id: presence_icon_3
              align: CENTER
              y: -44
              text_font: weather_icons
              text_color: 0x5A6472
              text: "\U000F02D7"
          - label:
              id: presence_label_3
              align: CENTER
              y: 4
              text: "-"
          - label:
              id: presence_name_3
              align: CENTER
              y: 38
              text_font: montserrat_14
              text_color: 0x6B7380
              text: "${orbital_person3_label}"
      - id: custom_3
        widgets:
          - label:
              id: custom_icon_3
              align: CENTER
              y: -44
