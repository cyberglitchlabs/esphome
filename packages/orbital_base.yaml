# HackerBox #0129 Orbital Hardware Package
# This package provides hardware-specific configuration for the Orbital
# ESP32-S3 SuperMini device driving five round 1.28" GC9A01A displays
# (240x240 each) via LVGL, three navigation buttons, and an onboard
# addressable RGB status LED. Pinout confirmed from the HackerBox 0129
# Instructables guide (Step 5) — differs from the upstream info-orbs
# project, which targets a plain ESP32.
#
# Required in your device yaml:
#   esphome:
#     name: your-device-name
#     friendly_name: "Your Device Name"
#
# Usage:
#   packages:
#     device:
#       url: https://github.com/cyberglitchlabs/esphome
#       files: [packages/orbital_base.yaml]
#       ref: main

substitutions:
  name: "orbital"
  friendly_name: "Orbital"

  # SPI bus (shared by all five displays)
  orbital_mosi_pin: GPIO11
  orbital_sclk_pin: GPIO12
  orbital_dc_pin: GPIO9
  orbital_reset_pin: GPIO13

  # Per-display chip-select pins
  orbital_cs1_pin: GPIO4
  orbital_cs2_pin: GPIO5
  orbital_cs3_pin: GPIO6
  orbital_cs4_pin: GPIO7
  orbital_cs5_pin: GPIO8

  # Buttons
  orbital_button_left_pin: GPIO2
  orbital_button_ok_pin: GPIO1
  orbital_button_right_pin: GPIO3

  # Onboard addressable RGB LED
  orbital_led_pin: GPIO48

  # Auto-cycle timing (only used while auto-cycle is toggled on via long-press OK)
  orbital_autocycle_interval: 30s

  # Weather set — point these at any HA weather-related entities you have
  orbital_weather_temp_entity: sensor.outdoor_temperature
  orbital_weather_humidity_entity: sensor.outdoor_humidity
  orbital_weather_condition_entity: weather.home
  orbital_weather_wind_entity: sensor.outdoor_wind_speed
  orbital_weather_forecast_entity: sensor.weather_forecast_summary

  # Presence set — point these at your HA person.* entities.
  # Note: this repo's bermuda_base.yaml package is a bare BLE proxy with no
  # person entities of its own; if you use Bermuda for presence, point these
  # at whatever entities the Bermuda HA integration created for you.
  orbital_person1_entity: person.person_1
  orbital_person2_entity: person.person_2
  orbital_person3_entity: person.person_3
  orbital_person4_entity: person.person_4
  orbital_person5_entity: person.person_5

  # Custom set — point these at absolutely anything HA already tracks
  # (energy, stocks, whatever). The device just displays the entity's state.
  orbital_custom1_entity: sensor.custom_1
  orbital_custom2_entity: sensor.custom_2
  orbital_custom3_entity: sensor.custom_3
  orbital_custom4_entity: sensor.custom_4
  orbital_custom5_entity: sensor.custom_5

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  project:
    name: cyberglitchlabs.hackerbox_orbital
    version: "1.0.0"
  on_boot:
    then:
      - light.turn_on:
          id: status_light
          red: 100%
          green: 0%
          blue: 0%

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf

api:
  reboot_timeout: 0s
  on_client_connected:
    - light.turn_on:
        id: status_light
        red: 0%
        green: 100%
        blue: 0%
  on_client_disconnected:
    - if:
        condition:
          wifi.connected:
        then:
          - light.turn_on:
              id: status_light
              red: 100%
              green: 80%
              blue: 0%

wifi:
  on_connect:
    - light.turn_on:
        id: status_light
        red: 100%
        green: 80%
        blue: 0%
  on_disconnect:
    - light.turn_on:
        id: status_light
        red: 100%
        green: 0%
        blue: 0%

logger:

time:
  - platform: homeassistant
    id: orbital_time

globals:
  - id: current_set
    type: int
    restore_value: false
    initial_value: "0"
  - id: autocycle_enabled
    type: bool
    restore_value: false
    initial_value: "false"

web_server:
  port: 80

# ---------------------------------------------------------------------------
# Hardware: Displays (5x round GC9A01A, shared SPI bus)
# ---------------------------------------------------------------------------

spi:
  id: spi_bus
  clk_pin: ${orbital_sclk_pin}
  mosi_pin: ${orbital_mosi_pin}

display:
  - platform: mipi_spi
    model: GC9A01A
    id: display_1
    spi_id: spi_bus
    cs_pin: ${orbital_cs1_pin}
    dc_pin:
      number: ${orbital_dc_pin}
      allow_other_uses: true
    reset_pin: ${orbital_reset_pin}
    invert_colors: true
    auto_clear_enabled: false
    update_interval: never  # LVGL drives redraws; no polling needed
  - platform: mipi_spi
    model: GC9A01A
    id: display_2
    spi_id: spi_bus
    cs_pin: ${orbital_cs2_pin}
    dc_pin:
      number: ${orbital_dc_pin}
      allow_other_uses: true
    invert_colors: true
    auto_clear_enabled: false
    update_interval: never
  - platform: mipi_spi
    model: GC9A01A
    id: display_3
    spi_id: spi_bus
    cs_pin: ${orbital_cs3_pin}
    dc_pin:
      number: ${orbital_dc_pin}
      allow_other_uses: true
    invert_colors: true
    auto_clear_enabled: false
    update_interval: never
  - platform: mipi_spi
    model: GC9A01A
    id: display_4
    spi_id: spi_bus
    cs_pin: ${orbital_cs4_pin}
    dc_pin:
      number: ${orbital_dc_pin}
      allow_other_uses: true
    invert_colors: true
    auto_clear_enabled: false
    update_interval: never
  - platform: mipi_spi
    model: GC9A01A
    id: display_5
    spi_id: spi_bus
    cs_pin: ${orbital_cs5_pin}
    dc_pin:
      number: ${orbital_dc_pin}
      allow_other_uses: true
    invert_colors: true
    auto_clear_enabled: false
    update_interval: never

# ---------------------------------------------------------------------------
# LVGL: one instance per display, four pages each (Clock/Weather/Presence/Custom)
# ---------------------------------------------------------------------------

lvgl:
  - id: lvgl_1
    displays:
      - display_1
    buffer_size: 10%
    default_font: montserrat_28
    pages:
      - id: clock_1
        widgets:
          - label:
              id: clock_time_1
              align: CENTER
              text: "00:00:00"
      - id: weather_1
        widgets:
          - label:
              id: weather_label_1
              align: CENTER
              text: "-"
      - id: presence_1
        widgets:
          - label:
              id: presence_label_1
              align: CENTER
              text: "-"
      - id: custom_1
        widgets:
          - label:
              id: custom_label_1
              align: CENTER
              text: "-"

  - id: lvgl_2
    displays:
      - display_2
    buffer_size: 10%
    default_font: montserrat_28
    pages:
      - id: clock_2
        widgets:
          - label:
              id: clock_date_2
              align: CENTER
              text: "0000-00-00"
      - id: weather_2
        widgets:
          - label:
              id: weather_label_2
              align: CENTER
              text: "-"
      - id: presence_2
        widgets:
          - label:
              id: presence_label_2
              align: CENTER
              text: "-"
      - id: custom_2
        widgets:
          - label:
              id: custom_label_2
              align: CENTER
              text: "-"

  - id: lvgl_3
    displays:
      - display_3
    buffer_size: 10%
    default_font: montserrat_28
    pages:
      - id: clock_3
        widgets:
          - label:
              id: clock_day_3
              align: CENTER
              text: "-"
      - id: weather_3
        widgets:
          - label:
              id: weather_label_3
              align: CENTER
              text: "-"
      - id: presence_3
        widgets:
          - label:
              id: presence_label_3
              align: CENTER
              text: "-"
      - id: custom_3
        widgets:
          - label:
              id: custom_label_3
              align: CENTER
              text: "-"

  - id: lvgl_4
    displays:
      - display_4
    buffer_size: 10%
    default_font: montserrat_28
    pages:
      - id: clock_4
        widgets:
          - label:
              id: clock_uptime_4
              align: CENTER
              text: "0 s"
      - id: weather_4
        widgets:
          - label:
              id: weather_label_4
              align: CENTER
              text: "-"
      - id: presence_4
        widgets:
          - label:
              id: presence_label_4
              align: CENTER
              text: "-"
      - id: custom_4
        widgets:
          - label:
              id: custom_label_4
              align: CENTER
              text: "-"

  - id: lvgl_5
    displays:
      - display_5
    buffer_size: 10%
    default_font: montserrat_28
    pages:
      - id: clock_5
        widgets:
          - label:
              id: clock_wifi_5
              align: CENTER
              text: "0 dBm"
      - id: weather_5
        widgets:
          - label:
              id: weather_label_5
              align: CENTER
              text: "-"
      - id: presence_5
        widgets:
          - label:
              id: presence_label_5
              align: CENTER
              text: "-"
      - id: custom_5
        widgets:
          - label:
              id: custom_label_5
              align: CENTER
              text: "-"

# ---------------------------------------------------------------------------
# Interval: drive Clock page labels from time, plus the Task 8 auto-cycle
# timer that advances the active set while auto-cycle is toggled on
# ---------------------------------------------------------------------------

interval:
  - interval: 1s
    then:
      - lvgl.label.update:
          id: clock_time_1
          text:
            time_format: "%H:%M:%S"
            time: orbital_time
  - interval: 60s
    then:
      - lvgl.label.update:
          id: clock_date_2
          text:
            time_format: "%Y-%m-%d"
            time: orbital_time
      - lvgl.label.update:
          id: clock_day_3
          text:
            time_format: "%A"
            time: orbital_time
  - interval: ${orbital_autocycle_interval}
    then:
      - if:
          condition:
            lambda: "return id(autocycle_enabled);"
          then:
            - lambda: |-
                id(current_set) = (id(current_set) + 1) % 4;
            - script.execute: show_current_set

# ---------------------------------------------------------------------------
# Diagnostic / management entities, plus the hardware navigation buttons
# (button_left/button_right/button_ok) that drive set switching and auto-cycle
# ---------------------------------------------------------------------------

binary_sensor:
  - platform: status
    name: "Status"
    entity_category: diagnostic
  - platform: gpio
    id: button_left
    pin:
      number: ${orbital_button_left_pin}
      mode: INPUT_PULLUP
      inverted: true
    internal: true
    on_click:
      min_length: 50ms
      max_length: 500ms
      then:
        - lambda: |-
            id(current_set) = (id(current_set) + 3) % 4;
        - script.execute: show_current_set
  - platform: gpio
    id: button_right
    pin:
      number: ${orbital_button_right_pin}
      mode: INPUT_PULLUP
      inverted: true
    internal: true
    on_click:
      min_length: 50ms
      max_length: 500ms
      then:
        - lambda: |-
            id(current_set) = (id(current_set) + 1) % 4;
        - script.execute: show_current_set
  - platform: gpio
    id: button_ok
    pin:
      number: ${orbital_button_ok_pin}
      mode: INPUT_PULLUP
      inverted: true
    internal: true
    on_click:
      - min_length: 50ms
        max_length: 500ms
        then:
          - script.execute: show_current_set
      - min_length: 500ms
        max_length: 5000ms
        then:
          - lambda: |-
              id(autocycle_enabled) = !id(autocycle_enabled);

sensor:
  - platform: wifi_signal
    id: wifi_signal_sensor
    name: "WiFi Signal"
    update_interval: 60s
    entity_category: diagnostic
    on_value:
      - lvgl.label.update:
          id: clock_wifi_5
          text:
            format: "%.0f dBm"
            args: [x]
  - platform: uptime
    id: uptime_sensor
    name: "Uptime"
    update_interval: 60s
    entity_category: diagnostic
    on_value:
      - lvgl.label.update:
          id: clock_uptime_4
          text:
            format: "%.0f s"
            args: [x]

button:
  - platform: restart
    name: "Restart"
    entity_category: config
  - platform: safe_mode
    name: "Safe Mode"
    entity_category: config

# ---------------------------------------------------------------------------
# Home Assistant data: Weather / Presence / Custom sets
# ---------------------------------------------------------------------------

text_sensor:
  - platform: homeassistant
    id: weather_temp_ts
    entity_id: ${orbital_weather_temp_entity}
    internal: true
    on_value:
      - lvgl.label.update:
          id: weather_label_1
          text: !lambda "return x;"
  - platform: homeassistant
    id: weather_humidity_ts
    entity_id: ${orbital_weather_humidity_entity}
    internal: true
    on_value:
      - lvgl.label.update:
          id: weather_label_2
          text: !lambda "return x;"
  - platform: homeassistant
    id: weather_condition_ts
    entity_id: ${orbital_weather_condition_entity}
    internal: true
    on_value:
      - lvgl.label.update:
          id: weather_label_3
          text: !lambda "return x;"
  - platform: homeassistant
    id: weather_wind_ts
    entity_id: ${orbital_weather_wind_entity}
    internal: true
    on_value:
      - lvgl.label.update:
          id: weather_label_4
          text: !lambda "return x;"
  - platform: homeassistant
    id: weather_forecast_ts
    entity_id: ${orbital_weather_forecast_entity}
    internal: true
    on_value:
      - lvgl.label.update:
          id: weather_label_5
          text: !lambda "return x;"
  - platform: homeassistant
    id: presence_person1_ts
    entity_id: ${orbital_person1_entity}
    internal: true
    on_value:
      - lvgl.label.update:
          id: presence_label_1
          text: !lambda "return x;"
  - platform: homeassistant
    id: presence_person2_ts
    entity_id: ${orbital_person2_entity}
    internal: true
    on_value:
      - lvgl.label.update:
          id: presence_label_2
          text: !lambda "return x;"
  - platform: homeassistant
    id: presence_person3_ts
    entity_id: ${orbital_person3_entity}
    internal: true
    on_value:
      - lvgl.label.update:
          id: presence_label_3
          text: !lambda "return x;"
  - platform: homeassistant
    id: presence_person4_ts
    entity_id: ${orbital_person4_entity}
    internal: true
    on_value:
      - lvgl.label.update:
          id: presence_label_4
          text: !lambda "return x;"
  - platform: homeassistant
    id: presence_person5_ts
    entity_id: ${orbital_person5_entity}
    internal: true
    on_value:
      - lvgl.label.update:
          id: presence_label_5
          text: !lambda "return x;"
  - platform: homeassistant
    id: custom_sensor1_ts
    entity_id: ${orbital_custom1_entity}
    internal: true
    on_value:
      - lvgl.label.update:
          id: custom_label_1
          text: !lambda "return x;"
  - platform: homeassistant
    id: custom_sensor2_ts
    entity_id: ${orbital_custom2_entity}
    internal: true
    on_value:
      - lvgl.label.update:
          id: custom_label_2
          text: !lambda "return x;"
  - platform: homeassistant
    id: custom_sensor3_ts
    entity_id: ${orbital_custom3_entity}
    internal: true
    on_value:
      - lvgl.label.update:
          id: custom_label_3
          text: !lambda "return x;"
  - platform: homeassistant
    id: custom_sensor4_ts
    entity_id: ${orbital_custom4_entity}
    internal: true
    on_value:
      - lvgl.label.update:
          id: custom_label_4
          text: !lambda "return x;"
  - platform: homeassistant
    id: custom_sensor5_ts
    entity_id: ${orbital_custom5_entity}
    internal: true
    on_value:
      - lvgl.label.update:
          id: custom_label_5
          text: !lambda "return x;"
  - platform: version
    name: "ESPHome Version"
    entity_category: diagnostic
  - platform: wifi_info
    ip_address:
      name: WiFi IP Address
      entity_category: diagnostic
    ssid:
      name: WiFi SSID
      entity_category: diagnostic
    mac_address:
      name: WiFi MAC Address
      entity_category: diagnostic

# ---------------------------------------------------------------------------
# Hardware: onboard RGB status LED — diagnostic only, not user-controllable
# ---------------------------------------------------------------------------

light:
  - platform: esp32_rmt_led_strip
    id: status_light
    pin: ${orbital_led_pin}
    num_leds: 1
    chipset: ws2812
    rgb_order: GRB
    internal: true
    default_transition_length: 0s

# ---------------------------------------------------------------------------
# Navigation: shared script flips all five displays to the active set
# ---------------------------------------------------------------------------

script:
  - id: show_current_set
    mode: restart
    then:
      - if:
          condition:
            lambda: "return id(current_set) == 0;"
          then:
            - lvgl.page.show:
                id: clock_1
                lvgl_id: lvgl_1
            - lvgl.page.show:
                id: clock_2
                lvgl_id: lvgl_2
            - lvgl.page.show:
                id: clock_3
                lvgl_id: lvgl_3
            - lvgl.page.show:
                id: clock_4
                lvgl_id: lvgl_4
            - lvgl.page.show:
                id: clock_5
                lvgl_id: lvgl_5
      - if:
          condition:
            lambda: "return id(current_set) == 1;"
          then:
            - lvgl.page.show:
                id: weather_1
                lvgl_id: lvgl_1
            - lvgl.page.show:
                id: weather_2
                lvgl_id: lvgl_2
            - lvgl.page.show:
                id: weather_3
                lvgl_id: lvgl_3
            - lvgl.page.show:
                id: weather_4
                lvgl_id: lvgl_4
            - lvgl.page.show:
                id: weather_5
                lvgl_id: lvgl_5
      - if:
          condition:
            lambda: "return id(current_set) == 2;"
          then:
            - lvgl.page.show:
                id: presence_1
                lvgl_id: lvgl_1
            - lvgl.page.show:
                id: presence_2
                lvgl_id: lvgl_2
            - lvgl.page.show:
                id: presence_3
                lvgl_id: lvgl_3
            - lvgl.page.show:
                id: presence_4
                lvgl_id: lvgl_4
            - lvgl.page.show:
                id: presence_5
                lvgl_id: lvgl_5
      - if:
          condition:
            lambda: "return id(current_set) == 3;"
          then:
            - lvgl.page.show:
                id: custom_1
                lvgl_id: lvgl_1
            - lvgl.page.show:
                id: custom_2
                lvgl_id: lvgl_2
            - lvgl.page.show:
                id: custom_3
                lvgl_id: lvgl_3
            - lvgl.page.show:
                id: custom_4
                lvgl_id: lvgl_4
            - lvgl.page.show:
                id: custom_5
                lvgl_id: lvgl_5
