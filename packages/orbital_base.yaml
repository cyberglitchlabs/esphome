          - label:
              id: custom_label_5
              align: CENTER
              y: 4
              text: "-"
          - label:
              id: custom_name_5
              align: CENTER
              y: 38
              text_font: montserrat_14
              text_color: 0x6B7380
              text: "${orbital_custom5_label}"

# ---------------------------------------------------------------------------
# Interval: drive Clock page labels from time, plus the Task 8 auto-cycle
# timer that advances the active set while auto-cycle is toggled on
# ---------------------------------------------------------------------------

interval:
  - interval: 1s
    then:
      - lvgl.indicator.update:
          id: minute_hand
          value: !lambda "return id(orbital_time).now().minute;"
      - lvgl.indicator.update:
          id: hour_hand
          value: !lambda |-
            auto t = id(orbital_time).now();
            return (t.hour % 12) * 60 + t.minute;
  - interval: 60s
    then:
      # Calendar page. strftime's day-of-month is zero-padded (%d) or
      # space-padded (%e) and the no-pad form is a GNU extension, so the
      # number comes from the field directly instead.
      - lvgl.label.update:
          id: clock_date_2
          text: !lambda |-
            char buf[4];
            snprintf(buf, sizeof(buf), "%d", id(orbital_time).now().day_of_month);
            return std::string(buf);
      - lvgl.label.update:
          id: clock_month_2
          text: !lambda |-
            std::string s = id(orbital_time).now().strftime("%b");
            for (auto &c : s) c = toupper(c);
            return s;
      - lvgl.label.update:
          id: clock_dow_2
          text: !lambda |-
            std::string s = id(orbital_time).now().strftime("%A");
            for (auto &c : s) c = toupper(c);
            return s;
      # Sunrise/sunset: show whichever comes next.
      - script.execute: update_sun_screen
  - interval: ${orbital_autocycle_interval}
    then:
      - if:
          condition:
            lambda: "return id(autocycle_enabled);"
          then:
            - lambda: |-
                id(current_set) = (id(current_set) + 1) % 4;
            - script.execute: show_current_set

# ---------------------------------------------------------------------------
# Diagnostic / management entities, plus the hardware navigation buttons
# (button_left/button_right/button_ok) that drive set switching and auto-cycle
# ---------------------------------------------------------------------------

binary_sensor:
  - platform: status
    name: "Status"
    entity_category: diagnostic
  - platform: gpio
    id: button_left
    pin:
      number: ${orbital_button_left_pin}
      mode: INPUT_PULLDOWN
    internal: true
    on_click:
      min_length: 50ms
      max_length: 500ms
      then:
        - lambda: |-
            id(current_set) = (id(current_set) + 3) % 4;
        - script.execute: show_current_set
  - platform: gpio
    id: button_right
    pin:
      number: ${orbital_button_right_pin}
      mode: INPUT_PULLDOWN
    internal: true
    on_click:
      min_length: 50ms
      max_length: 500ms
      then:
        - lambda: |-
            id(current_set) = (id(current_set) + 1) % 4;
        - script.execute: show_current_set
  - platform: gpio
    id: button_ok
    pin:
      number: ${orbital_button_ok_pin}
      mode: INPUT_PULLDOWN
    internal: true
    on_click:
      - min_length: 50ms
        max_length: 500ms
        then:
          - script.execute: show_current_set
      - min_length: 500ms
        max_length: 5000ms
        then:
          - lambda: |-
              id(autocycle_enabled) = !id(autocycle_enabled);

sensor:
  - platform: wifi_signal
    id: wifi_signal_sensor
    name: "WiFi Signal"
    update_interval: 60s
    entity_category: diagnostic
    # No longer drives a screen -- kept as an HA diagnostic entity, which is
    # where signal strength is actually useful.
  - platform: uptime
    id: uptime_sensor
    name: "Uptime"
    update_interval: 60s
    entity_category: diagnostic
    # No longer drives a screen -- kept as an HA diagnostic entity.

  - platform: homeassistant
    id: indoor_temp_num
    entity_id: ${orbital_indoor_entity}
    internal: true
    on_value:
      - lvgl.label.update:
          id: indoor_label_5
          text:
            format: "%.1f${orbital_indoor_unit}"
            args: [x]

  # Weather numerics, read as attributes off the single weather entity. Using
  # the numeric platform (rather than text_sensor) means x is a float, so the
  # value can be rounded for display — HA's raw state string would give us
  # "8.780000000000001" for wind speed.
  - platform: homeassistant
    id: weather_temp_num
    entity_id: ${orbital_weather_entity}
    attribute: temperature
    internal: true
    on_value:
      - lvgl.label.update:
          id: weather_label_1
