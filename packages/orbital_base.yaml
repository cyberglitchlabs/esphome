          id: weather_label_4
          text:
            format: "%.0f${orbital_weather_wind_unit}"
            args: [x]

button:
  - platform: restart
    name: "Restart"
    entity_category: config
  - platform: safe_mode
    name: "Safe Mode"
    entity_category: config

