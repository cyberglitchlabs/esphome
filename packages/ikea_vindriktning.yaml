# IKEA VINDRIKTNING Hardware Package
# This package provides hardware-specific configuration only.
# Users must define esphome, wifi, api, ota, and time in their device config.
#
# Required in your device yaml:
#   esphome:
#     name: your-device-name
#     friendly_name: "Your Device Name"
#
# Usage:
#   packages:
#     device:
#       url: https://github.com/cyberglitchlabs/esphome
#       files: [packages/ikea_vindriktning.yaml]
#       ref: main

substitutions:
  friendly_name: "IKEA VINDRIKTNING"

esphome:
  project:
    name: "cyberglitchlabs.ikea_vindriktning"
    version: "1.0.0"

esp8266:
  board: esp01_1m

logger:
  baud_rate: 0  # Disable UART logging to avoid conflicts with PM1006

time:
  - platform: homeassistant
    id: homeassistant_time

# The PM1006 sensor uses UART to communicate.
# Typical wiring for VINDRIKTNING is:
# IKEA (Rest) -> ESP8266 RX (GPIO3/RX)
uart:
  rx_pin: D4
  tx_pin: D2
  baud_rate: 9600

sensor:
  - platform: pm1006
    pm_2_5:
      name: "${friendly_name} PM 2.5"
#      filters:
#        - sliding_window_moving_average:
#            window_size: 10
#            send_every: 10
    update_interval: 20s

  - platform: uptime
    name: "${friendly_name} Uptime"
    entity_category: diagnostic

  - platform: wifi_signal
    name: "${friendly_name} WiFi Signal"
    entity_category: diagnostic
    update_interval: 60s

binary_sensor:
  - platform: status
    name: "${friendly_name} Status"
    entity_category: diagnostic

button:
  - platform: restart
    name: "${friendly_name} Restart"
    entity_category: config

  - platform: safe_mode
    name: "${friendly_name} Safe Mode"
    entity_category: config
