# Bermuda BLE Proxy Hardware Package
# This package provides a Bluetooth Low Energy proxy for the Bermuda BLE Trilateration
# integration (https://github.com/agittins/bermuda). Compatible with standard ESP32
# (BT4.2) and ESP32-S3/C3 (BT5) boards.
#
# This package provides hardware-specific configuration only.
# Users must define esphome, wifi, api, ota, and time in their device config.
#
# Required in your device yaml:
#   esphome:
#     name: your-device-name
#     friendly_name: "Your Device Name"
#
# Usage:
#   packages:
#     device:
#       url: https://github.com/cyberglitchlabs/esphome
#       files: [packages/bermuda_base.yaml]
#       ref: main

substitutions:
  name: "bermuda"
  friendly_name: "Bermuda"
  # BLE scan window (how long to listen per interval). Increase for more accuracy,
  # decrease if device becomes unstable. Must be <= scan_interval.
  ble_scan_interval: "320ms"
  ble_scan_window: "300ms"

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  project:
    name: "cyberglitchlabs.bermuda_proxy"
    version: "1.0.0"

esp32:
  board: wemos_d1_mini32
  framework:
    type: esp-idf

api:
  reboot_timeout: 0s

logger:
  baud_rate: 0

esp32_ble_tracker:
  scan_parameters:
    active: true
    interval: ${ble_scan_interval}
    window: ${ble_scan_window}

bluetooth_proxy:
  active: true

binary_sensor:
  - platform: status
    name: "Status"
    entity_category: diagnostic

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
    entity_category: diagnostic

  - platform: uptime
    name: "Uptime"
    update_interval: 60s
    entity_category: diagnostic

button:
  - platform: restart
    name: "Restart"
    entity_category: config

  - platform: safe_mode
    name: "Safe Mode"
    entity_category: config

text_sensor:
  - platform: version
    name: "ESPHome Version"
    entity_category: diagnostic

  - platform: wifi_info
    ip_address:
      name: WiFi IP Address
      entity_category: diagnostic
    ssid:
      name: WiFi SSID
      entity_category: diagnostic
    mac_address:
      name: WiFi MAC Address
      entity_category: diagnostic
