# OWON XDM Remote Hardware Package
# This package provides hardware-specific configuration only.
# Users must define esphome, wifi, api, ota, and time in their device config.
#
# Required in your device yaml:
#   esphome:
#     name: your-device-name
#     friendly_name: "Your Device Name"
#
# Usage:
#   packages:
#     device:
#       url: https://github.com/cyberglitchlabs/esphome
#       files: [packages/owon_xdm_base.yaml]
#       ref: main
#
# Features:
# - UART communication with OWON XDM1041 via SCPI protocol
# - Status LED control
# - Automatic multimeter initialization on boot
# - High sampling rate (RATE F) configuration

substitutions:
  friendly_name: "OWON XDM Remote"
  # Default command timeout in seconds
  command_timeout: "1.0"

esphome:
  project:
    name: "cyberglitchlabs.owon_xdm_remote"
    version: "1.0.0"
  on_boot:
    - priority: 600  # Run early for logging
      then:
        - logger.log: "OWON XDM Remote booting..."
    - priority: -100  # Run after everything else to initialize multimeter
      then:
        - script.execute: initialize_multimeter

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

logger:
  level: DEBUG
  baud_rate: 0  # Disable UART logging to avoid conflicts with multimeter UART

time:
  - platform: homeassistant
    id: homeassistant_time

api:
  reboot_timeout: 0s

# UART configuration for OWON XDM1041
uart:
  id: xdm_uart
  tx_pin: GPIO21
  rx_pin: GPIO20
  baud_rate: 115200
  data_bits: 8
  parity: NONE
  stop_bits: 1

# Status LED (active-low on ESP32-C3 Super Mini)
output:
  - platform: gpio
    pin: GPIO8
    inverted: true
    id: status_led_output

light:
  - platform: binary
    name: "Status LED"
    output: status_led_output
    id: status_led
    internal: true

button:
  - platform: restart
    name: 'Restart'
    entity_category: diagnostic

  - platform: safe_mode
    name: 'Safe Mode'
    entity_category: config

# Text sensors for SCPI responses and status
text_sensor:
  - platform: template
    name: "Response"
    id: scpi_response
    icon: "mdi:message-text"

  - platform: version
    name: 'ESPHome Version'
    entity_category: diagnostic

  - platform: wifi_info
    ip_address:
      name: WiFi IP Address
      entity_category: diagnostic
    ssid:
      name: WiFi SSID
      entity_category: diagnostic
    mac_address:
      name: WiFi MAC Address
      entity_category: diagnostic

# Sensors
sensor:
  - platform: uptime
    name: 'Uptime'
    entity_category: diagnostic
    unit_of_measurement: s

  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal_sensor
    entity_category: diagnostic
    update_interval: 60s

# Binary sensors for device connectivity
binary_sensor:
  - platform: status
    name: "Status"
    entity_category: diagnostic

# Startup sequence to initialize the multimeter
script:
  - id: initialize_multimeter
    mode: single
    then:
      - logger.log: "Starting multimeter initialization..."
      - light.turn_on:
          id: status_led
          transition_length: 0s
      - delay: 2s
      
      # Wait for idle line
      - logger.log: "Checking for idle UART line..."
      - delay: 2s
      
      # Query device identification
      - logger.log: "Querying device with *IDN?..."
      - uart.write:
          id: xdm_uart
          data: "*IDN?\r\n"
      - delay: 1s
      - lambda: |-
          std::string response = "";
          while (id(xdm_uart).available()) {
            uint8_t byte;
            id(xdm_uart).read_byte(&byte);
            response += (char)byte;
          }
          ESP_LOGI("xdm", "IDN Response: %s", response.c_str());
      
      # Set high sampling rate
      - logger.log: "Setting high sampling rate (RATE F)..."
      - uart.write:
          id: xdm_uart
          data: "RATE F\r\n"
      - delay: 500ms
      
      # Verify sampling rate
      - logger.log: "Verifying sampling rate (RATE?)..."
      - uart.write:
          id: xdm_uart
          data: "RATE?\r\n"
      - delay: 500ms
      - lambda: |-
          std::string response = "";
          while (id(xdm_uart).available()) {
            uint8_t byte;
            id(xdm_uart).read_byte(&byte);
            response += (char)byte;
          }
          response.erase(0, response.find_first_not_of(" \n\r\t"));
          response.erase(response.find_last_not_of(" \n\r\t") + 1);
          if (response == "F") {
            ESP_LOGI("xdm", "High sampling rate confirmed!");
          } else {
            ESP_LOGW("xdm", "Unexpected rate response: %s", response.c_str());
          }
      
      # Blink LED to indicate success
      - light.turn_off:
          id: status_led
          transition_length: 0s
      - delay: 500ms
      - light.turn_on:
          id: status_led
          transition_length: 0s
      - delay: 500ms
      - light.turn_off:
          id: status_led
          transition_length: 0s
      - delay: 500ms
      - light.turn_on:
          id: status_led
          transition_length: 0s
      
      - logger.log: "Multimeter initialization complete!"
