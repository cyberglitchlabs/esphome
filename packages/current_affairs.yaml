# Current Affairs Hardware Package
# CT clamp current monitor using ADS1115 ADC modules over I2C.
# Only J1 and J2 channels are currently wired.
#
# Required in your device yaml:
#   esphome:
#     name: your-device-name
#     friendly_name: "Your Device Name"
#
# Usage:
#   packages:
#     device:
#       url: https://github.com/cyberglitchlabs/esphome
#       files: [packages/current_affairs.yaml]
#       ref: main

substitutions:
  friendly_name: "Current Affairs"
  # The factor for the CT clamp (10A/1V)
  ct_factor: "10"
  # The update interval for the sensors
  update_interval: 60s
  # The sample duration for the CT clamp
  sample_duration: 1s
  # Nominal RMS voltage for power calculation
  rms_voltage: "120"

dashboard_import:
  package_import_url: github://cyberglitchlabs/esphome/packages/current_affairs.yaml
  import_full_config: false

esphome:
  project:
    name: "cyberglitchlabs.current_affairs"
    version: "1.0.0"

esp8266:
  board: d1_mini

api:
  reboot_timeout: 0s

logger:
  level: INFO

time:
  - platform: homeassistant
    id: esptime

i2c:
  sda: GPIO4
  scl: GPIO5
  scan: true

ads1115:
  - address: 0x48
    continuous_mode: true
    id: ads48_hub
  - address: 0x49
    continuous_mode: true
    id: ads49_hub
  - address: 0x4A
    continuous_mode: true
    id: ads4A_hub
  - address: 0x4B
    continuous_mode: true
    id: ads4B_hub

sensor:
  # ADS1115 at 0x48
  - platform: ads1115
    ads1115_id: ads48_hub
    multiplexer: 'A0_A1'
    gain: 1.024
    sample_rate: 860
    id: ads48_0_1_raw
    update_interval: never
  - platform: ads1115
    ads1115_id: ads48_hub
    multiplexer: 'A2_A3'
    gain: 1.024
    sample_rate: 860
    id: ads48_2_3_raw
    update_interval: never

  # ADS1115 at 0x49
  - platform: ads1115
    ads1115_id: ads49_hub
    multiplexer: 'A0_A1'
    gain: 1.024
    sample_rate: 860
    id: ads49_0_1_raw
    update_interval: never
  - platform: ads1115
    ads1115_id: ads49_hub
    multiplexer: 'A2_A3'
    gain: 1.024
    sample_rate: 860
    id: ads49_2_3_raw
    update_interval: never

  # ADS1115 at 0x4A
  - platform: ads1115
    ads1115_id: ads4A_hub
    multiplexer: 'A0_A1'
    gain: 1.024
    sample_rate: 860
    id: ads4A_0_1_raw
    update_interval: never
  - platform: ads1115
    ads1115_id: ads4A_hub
    multiplexer: 'A2_A3'
    gain: 1.024
    sample_rate: 860
    id: ads4A_2_3_raw
    update_interval: never

  # ADS1115 at 0x4B
  - platform: ads1115
    ads1115_id: ads4B_hub
    multiplexer: 'A0_A1'
    gain: 1.024
    sample_rate: 860
    id: ads4B_0_1_raw
    update_interval: never
  - platform: ads1115
    ads1115_id: ads4B_hub
    multiplexer: 'A2_A3'
    gain: 1.024
    sample_rate: 860
    id: ads4B_2_3_raw
    update_interval: never

  # CT Clamp Sensors
  - platform: ct_clamp
    sensor: ads48_0_1_raw
    name: "Channel J1 Current"
    id: j1_current
    update_interval: ${update_interval}
    sample_duration: ${sample_duration}
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 3

  - platform: ct_clamp
    sensor: ads48_2_3_raw
    name: "Channel J2 Current"
    id: j2_current
    update_interval: ${update_interval}
    sample_duration: ${sample_duration}
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 3

  # Power Sensors (current × nominal RMS voltage)
  - platform: template
    name: "Channel J1 Power"
    id: j1_power
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 1
    update_interval: ${update_interval}
    lambda: |-
      return id(j1_current).state * ${rms_voltage};

  - platform: template
    name: "Channel J2 Power"
    id: j2_power
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 1
    update_interval: ${update_interval}
    lambda: |-
      return id(j2_current).state * ${rms_voltage};

  # Daily Energy Sensors (kWh)
  - platform: total_daily_energy
    name: "Channel J1 Energy"
    id: j1_energy
    power_id: j1_power
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  - platform: total_daily_energy
    name: "Channel J2 Energy"
    id: j2_energy
    power_id: j2_power
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  # Diagnostics
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
    entity_category: diagnostic

  - platform: uptime
    name: "Uptime"
    update_interval: 60s
    entity_category: diagnostic

binary_sensor:
  - platform: status
    name: "Status"
    entity_category: diagnostic

button:
  - platform: restart
    name: "Restart"
    entity_category: config

  - platform: safe_mode
    name: "Safe Mode"
    entity_category: config

text_sensor:
  - platform: version
    name: 'ESPHome Version'
    entity_category: diagnostic

  - platform: wifi_info
    ip_address:
      name: WiFi IP Address
      entity_category: diagnostic
    ssid:
      name: WiFi SSID
      entity_category: diagnostic
    mac_address:
      name: WiFi MAC Address
      entity_category: diagnostic
