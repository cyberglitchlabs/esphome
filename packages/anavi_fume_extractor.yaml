# ANAVI Fume Extractor Hardware Package
# This package provides hardware-specific configuration only.
# Users must define esphome, wifi, api, ota, and time in their device config.
#
# Required in your device yaml:
#   esphome:
#     name: your-device-name
#     friendly_name: "Your Device Name"
#
# Usage:
#   packages:
#     device:
#       url: https://github.com/cyberglitchlabs/esphome
#       files: [packages/anavi_fume_extractor.yaml]
#       ref: main
#
# Features:
# - Fan relay control with physical button
# - MQ-135 Air Quality Sensor
# - HTU21D Temperature and Humidity Sensor
# - BH1750 Light Sensor
# - BMP180 Temperature and Pressure Sensor
# - APDS9960 Color/Gesture Sensor
# - SSD1306 OLED Display (128x64)
# - Status LED

substitutions:
  name: "anavi-fume-extractor"
  friendly_name: "ANAVI Fume Extractor"

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  project:
    name: "anavi.fume_extractor"
    version: "1.0.0"

esp8266:
  board: esp12e
  restore_from_flash: true

logger:
  level: INFO

time:
  - platform: homeassistant
    id: homeassistant_time

api:
  reboot_timeout: 0s

# I2C Bus for all sensors and OLED display
i2c:
  sda: GPIO4
  scl: GPIO5
  scan: true
  id: bus_a

# Fan control via relay
switch:
  - platform: gpio
    pin: GPIO12
    name: "Fan"
    id: fan_relay
    icon: "mdi:fan"
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - display.page.show: page_fan_on
    on_turn_off:
      - display.page.show: page_status

# Physical button to control fan (GPIO13)
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO13
      mode: INPUT_PULLUP
      inverted: true
    name: "Button"
    id: fan_button
    on_press:
      - switch.toggle: fan_relay
  
  - platform: status
    name: "Status"
    entity_category: diagnostic

# LED indicator (GPIO16)
output:
  - platform: gpio
    pin: GPIO16
    id: status_led_output
    inverted: false

light:
  - platform: binary
    name: "Status LED"
    output: status_led_output
    id: status_led
    restore_mode: ALWAYS_OFF

button:
  - platform: restart
    name: 'Restart'
    entity_category: diagnostic

  - platform: safe_mode
    name: 'Safe Mode'
    entity_category: config

# MQ-135 Air Quality Sensor (Analog A0)
sensor:
  - platform: adc
    pin: A0
    name: "Air Quality"
    id: air_quality_sensor
    update_interval: 60s
    filters:
      - lambda: |-
          // Convert to conductivity percentage
          float conductivity = (x / 3.3) * 100.0;
          return conductivity;
    unit_of_measurement: "%"
    accuracy_decimals: 0
    icon: "mdi:air-filter"

  - platform: uptime
    name: 'Uptime'
    entity_category: diagnostic
    unit_of_measurement: s

  - platform: wifi_signal
    name: "WiFi Signal"
    entity_category: diagnostic
    update_interval: 60s

  # HTU21D Temperature and Humidity Sensor
  - platform: htu21d
    temperature:
      name: "Temperature"
      id: htu_temperature
    humidity:
      name: "Humidity"
      id: htu_humidity
    update_interval: 60s

  # BH1750 Light Sensor
  - platform: bh1750
    name: "Illuminance"
    id: light_sensor
    address: 0x23
    update_interval: 60s

  # BMP180 Temperature and Pressure Sensor
  - platform: bmp085
    temperature:
      name: "BMP Temperature"
      id: bmp_temperature
    pressure:
      name: "Pressure"
      id: bmp_pressure
    update_interval: 60s

  # APDS9960 for color and gesture detection
  - platform: apds9960
    type: CLEAR
    name: "Clear Light"
    id: apds_clear
  - platform: apds9960
    type: RED
    name: "Red Light"
  - platform: apds9960
    type: GREEN
    name: "Green Light"
  - platform: apds9960
    type: BLUE
    name: "Blue Light"
  - platform: apds9960
    type: PROXIMITY
    name: "Proximity"

# APDS9960 Gesture Support
apds9960:
  address: 0x39
  update_interval: 60s

# Text sensor for air quality status
text_sensor:
  - platform: template
    name: "Air Quality Status"
    id: air_quality_status
    icon: "mdi:gauge"
    lambda: |-
      float conductivity = id(air_quality_sensor).state;
      if (conductivity <= 18) {
        return {"Good"};
      } else if (conductivity <= 36) {
        return {"Moderate"};
      } else if (conductivity <= 54) {
        return {"Unhealthy"};
      } else if (conductivity <= 72) {
        return {"Very Unhealthy"};
      } else {
        return {"Hazardous"};
      }
    update_interval: 60s

  - platform: template
    name: "Dangerous Gas"
    id: dangerous_gas
    icon: "mdi:biohazard"
    lambda: |-
      float conductivity = id(air_quality_sensor).state;
      return (conductivity > 36) ? std::string("on") : std::string("off");
    update_interval: 60s

  - platform: version
    name: 'ESPHome Version'
    entity_category: diagnostic

  - platform: wifi_info
    ip_address:
      name: WiFi IP Address
      entity_category: diagnostic
    ssid:
      name: WiFi SSID
      entity_category: diagnostic
    mac_address:
      name: WiFi MAC Address
      entity_category: diagnostic

# Mini OLED Display (128x64, I2C)
font:
  - file: "gfonts://Roboto"
    id: font_small
    size: 12
  - file: "gfonts://Roboto"
    id: font_medium
    size: 14
  - file: "gfonts://Roboto"
    id: font_large
    size: 16

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    address: 0x3C
    id: oled_display
    update_interval: 5s
    pages:
      - id: page_status
        lambda: |-
          // Status page showing temperature and humidity
          it.printf(0, 0, id(font_large), "Fume Extractor");
          if (id(htu_temperature).has_state()) {
            it.printf(0, 20, id(font_medium), "Temp: %.1f°C", id(htu_temperature).state);
          }
          if (id(htu_humidity).has_state()) {
            it.printf(0, 36, id(font_medium), "Hum: %.0f%%", id(htu_humidity).state);
          }
          if (id(air_quality_status).has_state()) {
            it.printf(0, 52, id(font_small), "Air: %s", id(air_quality_status).state.c_str());
          }
      
      - id: page_fan_on
        lambda: |-
          // Fan active page
          it.printf(0, 0, id(font_large), "Fume Extractor");
          it.printf(0, 24, id(font_large), "FAN: ON");
          if (id(air_quality_status).has_state()) {
            it.printf(0, 48, id(font_medium), "Air: %s", id(air_quality_status).state.c_str());
          }
