# ---------------------------------------------------------------------------
# Navigation: state (current set, autocycle), the 3 hardware buttons, and
# the script that flips all five displays to the active set.
# ---------------------------------------------------------------------------

globals:
  - id: current_set
    type: int
    restore_value: false
    initial_value: "0"
  - id: autocycle_enabled
    type: bool
    restore_value: false
    initial_value: "false"

binary_sensor:
  - platform: gpio
    id: button_left
    pin:
      number: ${orbital_button_left_pin}
      mode: INPUT_PULLDOWN
    internal: true
    on_click:
      min_length: 50ms
      max_length: 500ms
      then:
        - lambda: |-
            id(current_set) = (id(current_set) + 3) % 4;
        - script.execute: show_current_set
  - platform: gpio
    id: button_right
    pin:
      number: ${orbital_button_right_pin}
      mode: INPUT_PULLDOWN
    internal: true
    on_click:
      min_length: 50ms
      max_length: 500ms
      then:
        - lambda: |-
            id(current_set) = (id(current_set) + 1) % 4;
        - script.execute: show_current_set
  - platform: gpio
    id: button_ok
    pin:
      number: ${orbital_button_ok_pin}
      mode: INPUT_PULLDOWN
    internal: true
    on_click:
      - min_length: 50ms
        max_length: 500ms
        then:
          - script.execute: show_current_set
      - min_length: 500ms
        max_length: 5000ms
        then:
          - lambda: |-
              id(autocycle_enabled) = !id(autocycle_enabled);
  # Plane-overhead popup. Deliberately does not touch current_set: on_press
  # shows the plane pages directly; on_release just re-invokes
  # show_current_set, which restores whatever current_set still says since
  # this interrupt never changed it. Button presses are NOT guarded against
  # this -- a button press always wins over the popup.
  - platform: homeassistant
    id: plane_overhead
    entity_id: ${orbital_plane_overhead_entity}
    internal: true
    on_press:
      - lvgl.page.show:
          id: plane_1
          lvgl_id: lvgl_1
      - lvgl.page.show:
          id: plane_2
          lvgl_id: lvgl_2
      - lvgl.page.show:
          id: plane_3
          lvgl_id: lvgl_3
      - lvgl.page.show:
          id: plane_4
          lvgl_id: lvgl_4
      - lvgl.page.show:
          id: plane_5
          lvgl_id: lvgl_5
    on_release:
      - script.execute: show_current_set

interval:
  - interval: ${orbital_autocycle_interval}
    then:
      - if:
          condition:
            # Guarded so autocycle doesn't yank the plane pages away
            # mid-flyover -- it just skips its tick while the popup is up.
            lambda: "return id(autocycle_enabled) && !id(plane_overhead).state;"
          then:
            - lambda: |-
                id(current_set) = (id(current_set) + 1) % 4;
            - script.execute: show_current_set

script:
  - id: show_current_set
    mode: restart
    then:
      - if:
          condition:
            lambda: "return id(current_set) == 0;"
          then:
            - lvgl.page.show:
                id: clock_1
                lvgl_id: lvgl_1
            - lvgl.page.show:
                id: clock_2
                lvgl_id: lvgl_2
            - lvgl.page.show:
                id: clock_3
                lvgl_id: lvgl_3
            - lvgl.page.show:
                id: clock_4
                lvgl_id: lvgl_4
            - lvgl.page.show:
                id: clock_5
                lvgl_id: lvgl_5
      - if:
          condition:
            lambda: "return id(current_set) == 1;"
          then:
            - lvgl.page.show:
                id: weather_1
                lvgl_id: lvgl_1
            - lvgl.page.show:
                id: weather_2
                lvgl_id: lvgl_2
            - lvgl.page.show:
                id: weather_3
                lvgl_id: lvgl_3
            - lvgl.page.show:
                id: weather_4
                lvgl_id: lvgl_4
            - lvgl.page.show:
                id: weather_5
                lvgl_id: lvgl_5
      - if:
          condition:
            lambda: "return id(current_set) == 2;"
          then:
            - lvgl.page.show:
                id: presence_1
                lvgl_id: lvgl_1
            - lvgl.page.show:
                id: presence_2
                lvgl_id: lvgl_2
            - lvgl.page.show:
                id: presence_3
                lvgl_id: lvgl_3
            - lvgl.page.show:
                id: presence_4
                lvgl_id: lvgl_4
            - lvgl.page.show:
                id: presence_5
                lvgl_id: lvgl_5
      - if:
          condition:
            lambda: "return id(current_set) == 3;"
          then:
            - lvgl.page.show:
                id: custom_1
                lvgl_id: lvgl_1
            - lvgl.page.show:
                id: custom_2
                lvgl_id: lvgl_2
            - lvgl.page.show:
                id: custom_3
                lvgl_id: lvgl_3
            - lvgl.page.show:
                id: custom_4
                lvgl_id: lvgl_4
            - lvgl.page.show:
                id: custom_5
                lvgl_id: lvgl_5
